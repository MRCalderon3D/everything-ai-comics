prompt: "Black-and-white comic book page in a high-contrast ink noir style.\nLine: brush and nib inking, heavy variable-weight contours that vanish where forms fall into shadow.\nBlacks and shadow: large areas of solid spotted black; shadows drawn as flat black shapes with hard edges.\nTone: no grey tones, no gradients, no screentone; texture only from sparse dry-brush strokes.\nColor: pure black ink on white paper.\nRendering: faces simplified into planes of light and shadow, light described by untouched white paper, silhouettes that read at thumbnail size.\nPanels: clean black borders of even weight, white gutters.\nLettering: hand-lettered upper-case text in white balloons with a thin black outline, white caption boxes, sound effects as heavy black letters inside the art.\n\nCOVER\nThe front cover of one comic book issue: one single full-bleed illustration, portrait format, aspect ratio 2:3.\nNo panel grid, no panel borders, no gutters: the whole image is the cover.\nColor: monochrome. No color anywhere except the spot colors below.\nSpot color: signal red (#C0392B). Flare light only.\n\nREFERENCE IMAGES\nEach attached image has one role. Use it for that role only.\nImage 1: drawing style only (line, tone, texture, rendering). Do not copy its characters, composition, or text.\nImage 2: identity of Mara. Match the face, hair, build, and proportions exactly. Do not copy the sheet's poses, layout, background, or labels.\nImage 3: the location Ferry deck. Match its architecture, landmarks, and light. Do not copy its framing.\n\nSUBJECT\nConcept: Mara stands in the wheelhouse doorway with the flare gun lowered, looking down at the deck, where the tarpaulin over the crates has one corner lifted.\nComposition: Low angle from the deck. Mara is small and high at right, the crates large at lower left. The top third is black sky, left free for the title.\nSetting: Ferry deck. Open steel deck of a small river ferry at night with a raised wheelhouse aft and two lashed crates under a tarpaulin near the bow. Time of day: night.\nCharacters on the cover: 1 (Mara), each exactly once.\n- Mara. Wiry woman in her fifties with cropped grey hair, a broken nose and an oilskin coat torn at the left cuff. Action: Stands in the wheelhouse doorway, flare gun lowered in her right hand. Acting: Still, weight on one leg, eyes on the crates. Wardrobe: Black oilskin coat torn at the left cuff, wool jumper, canvas trousers, rubber boots. No hat. Holding: Flare gun (Orange single-shot flare pistol with a wide stubby barrel).\nProps in view:\n- Tarpaulin (Heavy canvas tarpaulin with rope eyelets along the hem, lashed over two crates with one corner loose).\n\nLETTERING\nLetter the cover with exactly these 2 elements. Copy every string character for character, with its accents and punctuation. Set the lettering in capitals; the words stay exactly as written.\n1. Title, the largest text on the cover: \"The Night Ferry\"\n2. Issue line, small, close to the title: \"No. 1: Crossing\"\nKeep the lettering clear of faces, hands, and the main action.\nSafe margin: keep every piece of lettering at least 4% of the page width away from the left and right edges, and at least 3% of the page height away from the top and bottom edges.\n\nHARD CONSTRAINTS\n- One single image. No panels, no borders, no insets.\n- Named characters on the cover: Mara, each exactly once.\n- No text other than the lettering listed above.\n- No watermark, signature, barcode, price, or page number."
