# The Night Ferry: example workspace configuration
# Schema: schemas/project.schema.json

title: The Night Ferry
comic_format: paged
publication: one-shot
logline: A ferry pilot finds a stowaway the harbour patrol is hunting.
genre: noir
language: en
reading_direction: ltr

page:
  aspect_ratio: "2:3"
  width_px: 2000
  height_px: 3000
  trim_mm: { width: 168, height: 260 }
  bleed_mm: 3
  safe_margin_mm: 6

color_mode: monochrome
spot_colors:
  - name: signal red
    hex: "#C0392B"
    use: Flare light only.             # no flare is fired in ISS_001, so these pages carry no red

lettering:
  mode: in_image
  font_family: Comic Neue
  case: upper
  max_words_per_balloon: 25
  max_words_per_panel: 50

style:
  look_refs: [LOOK_NOIR_INK_MASTER_V01]
  style_block: style/style-block.txt
  influences: [high-contrast ink noir]
  notes: Heavy blacks, no gradients.

default_providers:
  image: harness-native

deliverables:
  - target: pdf
    notes: Reading copy.
  - target: cbz
    notes: For comic reader apps.

content:
  rating: teen
  violence_treatment: Implied, never anatomical. The cut on the boy's hand is a dark line and a stained cuff.

repair_policy:
  max_cycles: 2

created_at: "2026-11-26"
version: "0.1.0"
