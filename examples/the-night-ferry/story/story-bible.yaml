# The Night Ferry: canon
# Schema: schemas/story-bible.schema.json

title: The Night Ferry
premise: >
  Mara pilots the last river ferry of the night, alone, an hour after curfew.
  Halfway across she finds a boy hiding on her deck, the same boy the harbour
  patrol has been asking every vessel to report. She has a flare gun in her
  hand and a searchlight coming up astern, and she decides not to use the one
  to call the other.
tone: Dry, tense, quiet.

world_rules:
  - After curfew the ferry runs dark, with one shielded lamp over the wheel.
  - The harbour patrol works from a launch with a searchlight and always comes up from astern.
  - A flare brings the patrol alongside within minutes.

