timeline:
  - order: 1
    event: A boy goes over the fence at the bonded sheds and cuts his left hand on the wire.
  - order: 2
    event: The boy hides under the tarpaulin on the ferry at the east dock.
  - order: 3
    event: Mara leaves the east dock an hour after curfew.
    issue: ISS_001
  - order: 4
    event: Mara hears the crates shift, takes the flare gun, and goes down to the deck.
    issue: ISS_001
  - order: 5
    event: Mara uncovers the boy and does not signal the patrol.
    issue: ISS_001

