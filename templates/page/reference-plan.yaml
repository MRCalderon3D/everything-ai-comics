# production/issues/ISS_001/pages/PG_001_001/reference-plan.yaml: reference selection
# Schema: schemas/reference-plan.schema.json
# Written by build-reference-plan.js or /reference-plan. One role per image, each asset once.

page: PG_001_001
provider: harness-native
budget: 4                              # the provider's reference image limit at planning time

required:
  - asset_id: LOOK_EXAMPLE_MASTER_V01  # asset ID, or a render ID for a previous page
    entity: LOOK_EXAMPLE               # entity ID. null for a render
    role: style                        # style | identity | wardrobe | spatial_continuity | prop_consistency | composition | edit_target
    priority: critical                 # critical | high | medium | low
    reason: Fixed drawing style for every request.
    omission_risk: The style drifts toward the model default.
  - asset_id: CHAR_EXAMPLE_TURN_MASTER_V01
    entity: CHAR_EXAMPLE
    role: identity                     # a style image never doubles as identity
    priority: critical
    reason: The character is drawn in both panels.
    omission_risk: The face and silhouette change between panels.

optional:
  - asset_id: LOC_EXAMPLE_PLATE_MASTER_V01
    entity: LOC_EXAMPLE
    role: spatial_continuity
    priority: medium
    reason: Keeps the door and the stairs on their sides.
    omission_risk: Landmarks swap sides.

exclude: []                            # asset IDs left out on purpose. Say why in notes
created_at: "2026-01-01"
